name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dayu_agent
          POSTGRES_USER: dayu_agent
          POSTGRES_PASSWORD: dayu_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayu_agent -d dayu_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DAYU_TEST_DATABASE_URL: postgresql+psycopg://dayu_agent:dayu_agent@127.0.0.1:5432/dayu_agent
      DATABASE_URL: postgresql+psycopg://dayu_agent:dayu_agent@127.0.0.1:5432/dayu_agent
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Quality gates
        run: |
          python -m ruff check .
          python -m mypy src/dayu_agent
          python scripts/generate_openapi.py --check
          python -m pytest --cov=dayu_agent --cov-report=term-missing --cov-fail-under=80
          python -m pip check
          python -m compileall -q src tests
