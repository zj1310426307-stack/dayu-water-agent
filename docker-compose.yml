name: dayu-water-agent

services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DAYU_AGENT_ENV: development
      DAYU_AGENT_HOST: 0.0.0.0
      DAYU_AGENT_PORT: 8000
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_NAME: ${MODEL_NAME:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://dayu_agent:dayu_agent@postgres:5432/dayu_agent
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${DAYU_AGENT_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayu_agent
      POSTGRES_USER: dayu_agent
      POSTGRES_PASSWORD: dayu_agent
    volumes:
      - dayu_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayu_agent -d dayu_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  dayu_agent_postgres:
