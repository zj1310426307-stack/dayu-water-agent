name: dayu-water-agent

services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DAYU_AGENT_ENV: production
      DAYU_AGENT_HOST: 0.0.0.0
      DAYU_AGENT_PORT: 8000
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_NAME: ${MODEL_NAME:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SESSION_STORE: postgres
      DATABASE_URL: postgresql+psycopg://dayu_agent:${POSTGRES_PASSWORD:-dayu_agent}@postgres:5432/dayu_agent
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_MAX_ELAPSED_SECONDS: ${RETRY_MAX_ELAPSED_SECONDS:-30}
      STREAM_EVENT_RETENTION_SECONDS: ${STREAM_EVENT_RETENTION_SECONDS:-86400}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn dayu_agent.api.app:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "${DAYU_AGENT_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayu_agent
      POSTGRES_USER: dayu_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayu_agent}
    volumes:
      - dayu_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayu_agent -d dayu_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  dayu_agent_postgres:
